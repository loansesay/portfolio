<!DOCTYPE html>
<html lang="nl-BE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/tailwind.css">
    <title>Contact - Loan</title>
    <meta name="description" content="Portfolio van Loan Badara Sesay, op dit pagina kan je contact nemen met Loan en enkele vragen stellen of problemen rapporteren.">
</head>
<div class="mx-auto px-4 md:max-w-6xl">
<header class="bg-purple-700 mt-8 flex items-center justify-between p-6">
    <h2 class="font-bold text-2xl">Loan Sesay</h2>
    <input type="checkbox" id="menu-knop" class="peer sr-only">
    <label for="menu-knop" class="cursor-pointer rounded-lg border border-gray-300 px-3 py-2 peer-focus-visible:outline-2 md:hidden">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="size-5"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M4 18L20 18" stroke="#000000" stroke-width="2" stroke-linecap="round"></path> <path d="M4 12L20 12" stroke="#000000" stroke-width="2" stroke-linecap="round"></path> <path d="M4 6L20 6" stroke="#000000" stroke-width="2" stroke-linecap="round"></path> </g></svg>
    </label>
    <nav aria-label="Hoofdmenu" class="hidden w-full peer-checked:block md:block md:w-auto">
        <ul class="flex flex-wrap gap-x-4 gap-6">
            <a href="index.html" class="hover:text-red-400"><li>Home</li></a>
            <a href="portfolio.html" class="hover:text-red-400"><li>Portfolio</li></a>
            <a href="project.html" class="hover:text-red-400"><li>Project</li></a>
            <a href="contact.html" aria-current="page" class="hover:text-red-400 text-blue-400"><li>Contact</li></a>
        </ul>
    </nav>
</header>
<body class="text-white bg-gray-900">
    <form name="contact" method="POST" data-netlify="true" class="">
        <p><label for="mail">e-mail<span class="text-red-700" aria-hidden="true">*</span></label><br><input type="email" name="mail" id="email" autocomplete="email" required aria-describedby="mail-hulp" class="mt-1 w-full rounded-lg border border-gray-400 bg-white text-gray-900 px-3 py-2"></p><p id="nummer" class="mt-1 text-sm text-gray-600"></p>
        
        <p><label for="onderwerp">Onderwerp</label><br><select name="onderwerp" id="onderwerp" class="mt-1 w-full rounded-lg border border-gray-400 bg-white text-gray-900 px-3 py-2">
                <option value="">wat wil je een vraag over stellen</option>
                <option value="">Extra info over mezelf</option>
                <option value="">Educatie</option>
                <option value="">Andere</option>
        </select></p>

        <div>
            <p><label for="message" class="block font-medium">Wat is je bericht?<span class="text-red-700" aria-hidden="true">*</span></label>
            <textarea name="bericht" id="bericht" rows="5" class="mt-1 w-full rounded-lg border border-gray-400 bg-white text-gray-900 px-3 py-2"></textarea></p>
        </div>

        <button type="submit" class="rounded-lg bg-blue-700 px-5 py-2 font-semibold text-white hover:bg-blue-800 focus-visible:outline-2 focus-visible:outline-2-offset focus-visible:outline-blue-700 mt-5">Verstuur</button>
    </form>
</body>
<footer class="border-t border-gray-200 mt-4 text-gray-200 mb-4 flex justify-between">
    <p>&copy 2026 Loan Sesay</p>
    <p>loan.sesay@student.ap.be</p>
</footer>
</div>
</html>
